<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarter Pong</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <script src="https://unpkg.com/@wasmer/sdk@latest/dist/index.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        .neon-text {
            text-shadow: 0 0 5px #22d3ee, 0 0 10px #22d3ee, 0 0 15px #22d3ee;
        }
        .neon-red {
            text-shadow: 0 0 5px #ef4444, 0 0 10px #ef4444;
        }
        .glow-card:hover {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.7);
        }
        .glow-card-red:hover {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.7);
        }
.logo-glow {
            filter: drop-shadow(0 0 20px rgba(34, 211, 238, 0.6));
        }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans">
    <div id="vanta-bg" class="absolute top-0 left-0 w-full h-full"></div>
    
    <main class="relative z-10 flex min-h-screen flex-col items-center justify-center p-4 sm:p-8 md:p-16">
        <!-- Animated Logo Section -->
        <div class="relative mb-12 md:mb-20 max-w-full h-auto animate-pulse-slow">
            <img 
                src="/qpbwlogo.svg" 
                alt="Quarter Pong Logo"
                class="logo-glow max-w-full h-auto w-full md:w-[618px]"
                style="transform: perspective(800px) rotateX(10deg);"
            >
            <div class="absolute inset-0 bg-blue-500/10 rounded-full blur-xl animate-pulse"></div>
        </div>

        <!-- Navigation Grid with Enhanced Effects -->
        <div class="grid w-full max-w-7xl grid-cols-1 gap-6 sm:gap-8 md:grid-cols-2 lg:grid-cols-3">
            <!-- Rules Card -->
            <a href="/rules"
               class="group relative overflow-hidden rounded-2xl p-6 transition-all duration-500 bg-gray-900/70 backdrop-blur-md border border-gray-700 hover:border-red-500 hover:bg-gray-800/50 glow-card-red">
                <div class="absolute inset-0 bg-gradient-to-br from-transparent via-red-900/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <h2 class="relative mb-4 text-3xl font-bold text-red-500 neon-red group-hover:text-white font-['Orbitron']">
Rules <i data-feather="book-open" class="inline align-middle ml-2 group-hover:rotate-12 transition-transform"></i>
                </h2>
                <p class="relative m-0 max-w-[30ch] text-gray-300 group-hover:text-white transition-colors">
                    Check out the official rules and game modes for the greatest party game ever played.
                </p>
                <div class="absolute bottom-4 right-4 text-red-500 opacity-0 group-hover:opacity-100 transition-all duration-300">
<i data-feather="arrow-right" class="w-6 h-6"></i>
                </div>
            </a>

            <!-- Store Card -->
            <a href="/store"
               class="group relative overflow-hidden rounded-2xl p-6 transition-all duration-500 bg-gray-900/70 backdrop-blur-md border border-gray-700 hover:border-blue-500 hover:bg-gray-800/50 glow-card">
                <div class="absolute inset-0 bg-gradient-to-br from-transparent via-blue-900/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <h2 class="relative mb-4 text-3xl font-bold text-blue-500 neon-text group-hover:text-white font-['Orbitron']">
Store <i data-feather="shopping-bag" class="inline align-middle ml-2 group-hover:rotate-12 transition-transform"></i>
                </h2>
                <p class="relative m-0 max-w-[30ch] text-gray-300 group-hover:text-white transition-colors">
                    Shop for official Quarter Pong gear and game sets. Gear up for your next tournament!
                </p>
                <div class="absolute bottom-4 right-4 text-blue-400 opacity-0 group-hover:opacity-100 transition-all duration-300">
                    <i data-feather="arrow-right" class="w-6 h-6"></i>
                </div>
            </a>

            <!-- Community Card -->
            <a href="/community"
               class="group relative overflow-hidden rounded-2xl p-6 transition-all duration-500 bg-gray-900/70 backdrop-blur-md border border-gray-700 hover:border-red-500 hover:bg-gray-800/50 glow-card-red">
                <div class="absolute inset-0 bg-gradient-to-br from-transparent via-red-900/30 to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <h2 class="relative mb-4 text-3xl font-bold text-red-500 neon-red group-hover:text-white font-['Orbitron']">
Community <i data-feather="users" class="inline align-middle ml-2 group-hover:rotate-12 transition-transform"></i>
                </h2>
                <p class="relative m-0 max-w-[30ch] text-gray-300 group-hover:text-white transition-colors">
                    Join the conversation, find local tournaments, or submit your feedback.
                </p>
                <div class="absolute bottom-4 right-4 text-red-500 opacity-0 group-hover:opacity-100 transition-all duration-300">
<i data-feather="arrow-right" class="w-6 h-6"></i>
                </div>
            </a>
        </div>

        <!-- Floating Particles -->
        <div class="absolute inset-0 overflow-hidden pointer-events-none">
            <div class="particle absolute rounded-full bg-blue-500/20"></div>
            <div class="particle absolute rounded-full bg-pink-500/20"></div>
            <div class="particle absolute rounded-full bg-blue-500/20"></div>
        </div>
    </main>

    <script>
        // Initialize Vanta.js background
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x3b82f6,
            backgroundColor: 0x111827,
            points: 10.00,
            maxDistance: 22.00,
            spacing: 18.00
        });

        // Create floating particles
        document.addEventListener('DOMContentLoaded', () => {
            feather.replace();
            
            const particlesContainer = document.querySelector('.absolute.inset-0');
            for (let i = 0; i < 15; i++) {
                const particle = document.createElement('div');
                particle.classList.add('particle');
                particle.style.width = `${Math.random() * 5 + 2}px`;
                particle.style.height = particle.style.width;
                particle.style.left = `${Math.random() * 100}%`;
                particle.style.top = `${Math.random() * 100}%`;
                particle.style.opacity = Math.random() * 0.5 + 0.1;
                particle.style.animationDuration = `${Math.random() * 20 + 10}s`;
                particle.style.animationDelay = `${Math.random() * 5}s`;
            particle.style.backgroundColor = i % 2 === 0 ? 'rgba(59, 130, 246, 0.3)' : 'rgba(239, 68, 68, 0.3)';
particlesContainer.appendChild(particle);
            }

            // Add animation to particles
            const style = document.createElement('style');
            style.textContent = `
                @keyframes float {
                    0% { transform: translateY(0) translateX(0); }
                    50% { transform: translateY(-100px) translateX(50px); }
                    100% { transform: translateY(0) translateX(0); }
                }
                .particle {
                    position: absolute;
                    border-radius: 50%;
                    animation: float linear infinite;
                }
                .animate-pulse-slow {
                    animation: pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
                }
                @keyframes pulse {
                    0%, 100% { transform: scale(1) rotate(0deg); }
                    50% { transform: scale(1.03) rotate(1deg); }
                }
            `;
            document.head.appendChild(style);
        });
    </script>
</body>
</html>
