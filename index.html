<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarter Pong</title>
    <link rel="icon" type="image/x-icon" href="image/favicon.ico">
    <!-- Load Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@wasmer/sdk@latest/dist/index.js"></script>
    <style>
        /* Custom CSS for a dark, neon arcade theme */
        @import url('https://fonts.googleapis.com/css2?family=VT323&display=swap');
        
        :root {
            /* Primary Accent Color: Neon Red */
            --color-neon-red: #FF3366; 
            /* Secondary Accent Color: Neon Blue */
            --color-neon-blue: #33CCFF;
        }

        body {
            font-family: 'VT323', monospace; /* Retro arcade font */
            background-color: #0d0d0d; /* Very dark background */
        }
        
        /* Neon Red Styles (Primary) */
        .neon-red-border {
            border: 2px solid var(--color-neon-red);
            box-shadow: 0 0 10px var(--color-neon-red), 0 0 5px rgba(255, 51, 102, 0.5);
        }

        .neon-red-text {
            color: var(--color-neon-red);
            text-shadow: 0 0 5px rgba(255, 51, 102, 0.7);
        }

        /* Neon Blue Styles (Secondary/Interactive) */
        .neon-blue-border {
            border: 2px solid var(--color-neon-blue);
            box-shadow: 0 0 10px var(--color-neon-blue), 0 0 5px rgba(51, 204, 255, 0.5);
            transition: all 0.3s ease;
        }

        .neon-blue-box:hover {
            background-color: var(--color-neon-blue);
            color: #000 !important; /* Override text color on hover */
            box-shadow: 0 0 25px var(--color-neon-blue);
            transform: scale(1.02);
            cursor: pointer;
        }

        /* Aspect Ratio Container (Updated to 25% for a shorter banner) */
        .logo-aspect-ratio {
            padding-bottom: 22%; 
        }
    </style>
</head>
<!-- Make body take up the full screen height for centering -->
<body class="min-h-screen flex flex-col items-center justify-center p-4">

    <!-- Main Arcade Container: Now fills full available width (w-full) -->
    <main class="w-full p-6 bg-gray-900 rounded-xl neon-red-border">
        
        <!-- Header / Main Title Area: Text size reduced and made responsive -->
        <header class="text-center mb-8">
            <h1 class="text-3xl sm:text-5xl font-bold uppercase tracking-widest neon-red-text">
               Be the last one standing
            </h1>
        </header>

        <!-- Logo / Banner Placeholder: Max width set to 600px -->
        <div class="flex justify-center mb-6"> <!-- Reduced mb-10 to mb-6 -->
            <!-- Inner container to cap max width at 600px and enforce aspect ratio -->
            <div id="logo-area" 
                 class="w-full bg-gray-800 rounded-lg neon-blue-border relative logo-aspect-ratio" 
                 style="max-width: 300px; height: 0; overflow: hidden;">
                
                <!-- The content inside is absolutely positioned to cover the height created by padding-bottom, now with horizontal padding (px-4) -->
                <div class="absolute inset-0 flex items-center justify-center px-0">
                    <img src="qpbluered.PNG" 
                         alt="Quarter Pong Logo" 
                         class="w-full h-full object-fit: contain;"
                         onerror="this.onerror=null; this.src='https://placehold.co/600x150/111/FF3366?text=LOGO+FILE+MISSING'; this.classList.remove('p-4'); this.classList.add('p-0');"
                    >
                </div>
            </div>
        </div>


        <!-- Three Main Navigation Boxes (Rules, Store, Community) -->
        <div class="grid grid-cols-1 md:grid-cols-3 gap-6 justify-center">

            <!-- Rules Box -->
            <div class="p-8 text-center rounded-lg bg-gray-800 neon-blue-border neon-blue-box" onclick="console.log('Navigate to Rules')">
                <div class="w-16 h-16 mx-auto mb-3 neon-red-text">
                    <!-- Rules/Documentation Icon (File Text) -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto">
                        <path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z"></path>
                        <polyline points="14 2 14 8 20 8"></polyline>
                        <line x1="16" x2="8" y1="13" y2="13"></line>
                        <line x1="16" x2="8" y1="17" y2="17"></line>
                    </svg>
                </div>
                <h2 class="text-4xl uppercase font-bold text-gray-200">
                    Rules
                </h2>
                <p class="mt-2 text-gray-400 text-lg">
                    Check out the official rules and game modes for the greatest party game ever played.
                </p>
            </div>

            <!-- Store Box -->
            <div class="p-8 text-center rounded-lg bg-gray-800 neon-blue-border neon-blue-box" onclick="console.log('Navigate to Store')">
                <div class="w-16 h-16 mx-auto mb-3 neon-red-text">
                    <!-- Store/E-commerce Icon (Shopping Cart) -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto">
                        <circle cx="8" cy="21" r="1"></circle>
                        <circle cx="19" cy="21" r="1"></circle>
                        <path d="M2.05 2.05h2l2.6 12.42a2 2 0 0 0 2 1.58h9.72a2 2 0 0 0 2-1.58L23 6H6"></path>
                    </svg>
                </div>
                <h2 class="text-4xl uppercase font-bold text-gray-200">
                    Store
                </h2>
                <p class="mt-2 text-gray-400 text-lg">
                    Shop for official Quarter Pong gear and game sets. Gear up for your next tournament!
                </p>
            </div>

            <!-- Community Box -->
            <div class="p-8 text-center rounded-lg bg-gray-800 neon-blue-border neon-blue-box" onclick="console.log('Navigate to Community')">
                <div class="w-16 h-16 mx-auto mb-3 neon-red-text">
                    <!-- Community/Social Icon (Users) -->
                    <svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="mx-auto">
                        <path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"></path>
                        <circle cx="9" cy="7" r="4"></circle>
                        <path d="M22 21v-2a4 4 0 0 0-3-3.87"></path>
                        <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                    </svg>
                </div>
                <h2 class="text-4xl uppercase font-bold text-gray-200">
                    Community
                </h2>
                <p class="mt-2 text-gray-400 text-lg">
                    Join the conversation, find local tournaments, or submit your feedback.
                </p>
            </div>

        </div>

    </main>

    <!-- Footer / Credit -->
    <!-- The footer is still commented out, saving vertical space. -->
    <!--
    <footer class="mt-10 text-center text-gray-500">
        <p class="text-sm">Made in the USA | Patent Pending</p>
    </footer>
    -->
    
</body>
</html>
