<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarter Pong - Store</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        .neon-text {
            text-shadow: 0 0 5px #22d3ee, 0 0 10px #22d3ee, 0 0 15px #22d3ee;
        }
        .neon-red {
            text-shadow: 0 0 5px #ef4444, 0 0 10px #ef4444;
        }
        .glow-card:hover {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.7);
        }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans">
    <div id="vanta-bg" class="absolute top-0 left-0 w-full h-full"></div>
    
    <main class="relative z-10 min-h-screen p-8 md:p-16">
        <div class="max-w-7xl mx-auto">
            <a href="/index.html" class="inline-block mb-8 hover:text-blue-400 transition-colors">
                <i data-feather="arrow-left" class="inline mr-2"></i> Back to Home
            </a>
            
            <h1 class="text-4xl md:text-5xl font-bold mb-8 text-blue-400 neon-text font-['Orbitron']">
                Official Store <i data-feather="shopping-bag" class="inline"></i>
            </h1>
            
            <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                <div class="bg-gray-900/70 backdrop-blur-md border border-gray-700 rounded-xl p-6 glow-card">
                    <img src="http://static.photos/sport/640x360/1" alt="Quarter Pong Set" class="w-full h-48 object-cover rounded-lg mb-4">
                    <h3 class="text-xl font-bold mb-2">Deluxe Quarter Pong Set</h3>
                    <p class="text-gray-300 mb-4">Everything you need to start playing</p>
                    <button class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg transition-colors">
                        $TBD - Add to Cart
                    </button>
                </div>
                
                <div class="bg-gray-900/70 backdrop-blur-md border border-gray-700 rounded-xl p-6 glow-card">
                    <img src="http://static.photos/retail/640x360/2" alt="Official T-Shirt" class="w-full h-48 object-cover rounded-lg mb-4">
                    <h3 class="text-xl font-bold mb-2">Official Apparel</h3>
                    <p class="text-gray-300 mb-4">Show your Quarter Pong pride</p>
                    <button class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg transition-colors">
                        $TBD - Add to Cart
                    </button>
                </div>
                
                <div class="bg-gray-900/70 backdrop-blur-md border border-gray-700 rounded-xl p-6 glow-card">
                    <img src="http://static.photos/retail/640x360/3" alt="Tournament Pack" class="w-full h-48 object-cover rounded-lg mb-4">
                    <h3 class="text-xl font-bold mb-2">Tournament Pack</h3>
                    <p class="text-gray-300 mb-4">For serious competitors</p>
                    <button class="w-full bg-blue-600 hover:bg-blue-500 text-white py-2 rounded-lg transition-colors">
                        $TBD - Add to Cart
                    </button>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Initialize Vanta.js background
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x3b82f6,
            backgroundColor: 0x111827,
            points: 10.00,
            maxDistance: 22.00,
            spacing: 18.00
        });

        document.addEventListener('DOMContentLoaded', () => {
            feather.replace();
        });
    </script>
</body>
</html>
