<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quarter Pong - Rules</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/feather-icons"></script>
    <script src="https://cdn.jsdelivr.net/npm/vanta@latest/dist/vanta.net.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&display=swap');
        .neon-text {
            text-shadow: 0 0 5px #22d3ee, 0 0 10px #22d3ee, 0 0 15px #22d3ee;
        }
        .neon-red {
            text-shadow: 0 0 5px #ef4444, 0 0 10px #ef4444;
        }
        .glow-card:hover {
            box-shadow: 0 0 15px rgba(59, 130, 246, 0.7);
        }
        .glow-card-red:hover {
            box-shadow: 0 0 15px rgba(239, 68, 68, 0.7);
        }
    </style>
</head>
<body class="bg-gray-950 text-white font-sans">
    <div id="vanta-bg" class="absolute top-0 left-0 w-full h-full"></div>
    
    <main class="relative z-10 min-h-screen p-8 md:p-16">
        <div class="max-w-7xl mx-auto">
            <a href="/" class="inline-block mb-8 hover:text-blue-400 transition-colors">
                <i data-feather="arrow-left" class="inline mr-2"></i> Back to Home
            </a>
            
            <h1 class="text-4xl md:text-5xl font-bold mb-8 text-red-500 neon-red font-['Orbitron']">
                Game Rules <i data-feather="book-open" class="inline"></i>
            </h1>
            
            <div class="grid gap-8">
                <div class="bg-gray-900/70 backdrop-blur-md border border-gray-700 rounded-xl p-6 glow-card-red">
                    <h2 class="text-2xl font-bold mb-4 text-red-400">Basic Rules</h2>
                    <ol class="list-decimal pl-5 space-y-3">
                        <li>tbd</li>
                        <li>tbd</li>
                        <li>tbd</li>
                        <li>tbd</li>
                    </ol>
                </div>
                
                <div class="bg-gray-900/70 backdrop-blur-md border border-gray-700 rounded-xl p-6 glow-card-red">
                    <h2 class="text-2xl font-bold mb-4 text-red-400">Tournament Rules</h2>
                    <ol class="list-decimal pl-5 space-y-3">
                        <li>tbd</li>
                        <li>tbd</li>
                        <li>tbd</li>
                        <li>tbd</li>
                    </ol>
                </div>
            </div>
        </div>
    </main>

    <script>
        // Initialize Vanta.js background
        VANTA.NET({
            el: "#vanta-bg",
            mouseControls: true,
            touchControls: true,
            gyroControls: false,
            minHeight: 200.00,
            minWidth: 200.00,
            scale: 1.00,
            scaleMobile: 1.00,
            color: 0x3b82f6,
            backgroundColor: 0x111827,
            points: 10.00,
            maxDistance: 22.00,
            spacing: 18.00
        });

        document.addEventListener('DOMContentLoaded', () => {
            feather.replace();
        });
    </script>
</body>
</html>
